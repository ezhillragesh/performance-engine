name: Feature request
description: Suggest a new analysis rule, panel feature, accessibility rule or API.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What question can't you answer today? For a new rule, which pattern should be detected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: For a rule, give the evidence it would use and the thresholds. Rules need a true positive and a true negative case.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
